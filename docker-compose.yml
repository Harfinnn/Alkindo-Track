services:
  gate-counting:
    build:
      context: .
      dockerfile: Dockerfile.gate
    container_name: gate-counting
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      - INFER_DEVICE=intel:cpu
      - VIEWER_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models
      - ./logs:/app/logs
      - ./web:/app/web:ro